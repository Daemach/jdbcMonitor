name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Tests (Lucee ${{ matrix.lucee }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        lucee: ["5.3", "5.4", "6.0"]
        experimental: [false]
        include:
          - lucee: "6.1"
            experimental: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jdbcmonitor_test
          MYSQL_USER: jdbcmonitor
          MYSQL_PASSWORD: jdbcmonitor_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: 6.3.1
          forgeboxAPIKey: ${{ secrets.FORGEBOX_API_KEY }}

      - name: Install dependencies
        run: |
          box install
          box config set verboseErrors=true

      - name: Initialize database
        run: mysql -h 127.0.0.1 -u root -proot < tests/sql/setup-mysql.sql

      - name: Start server
        run: |
          box server start cfengine=lucee@${{ matrix.lucee }} --debug
          sleep 10

      - name: Run tests
        run: |
          box testbox run \
            runner="http://127.0.0.1:8888/tests/runner.cfm" \
            outputFormats="json,text"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-lucee-${{ matrix.lucee }}
          path: |
            tests/results/**
            .engine/*/logs/**

      - name: Stop server
        if: always()
        run: box server stop

  test-boxlang:
    name: Tests (BoxLang - Experimental)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jdbcmonitor_test
          MYSQL_USER: jdbcmonitor
          MYSQL_PASSWORD: jdbcmonitor_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: 6.3.2

      - name: Install dependencies
        run: |
          box install
          box install commandbox-boxlang
          box config set verboseErrors=true

      - name: Install BoxLang modules
        run: |
          box boxlang install-module bx-compat-cfml
          box boxlang install-module bx-mysql

      - name: Initialize database
        run: mysql -h 127.0.0.1 -u root -proot < tests/sql/setup-mysql.sql

      - name: Start BoxLang server
        run: |
          box server start cfengine=boxlang port=8888 --noSaveSettings --debug
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8888/tests/runner.cfm?reporter=json > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 5
          done

      - name: Run tests
        run: |
          box testbox run \
            runner="http://127.0.0.1:8888/tests/runner.cfm" \
            outputFormats="json,text"

      - name: Stop server
        if: always()
        run: box server stop

  publish:
    name: Publish to ForgeBox
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: 6.3.1

      - name: Clean CommandBox
        run: rm -rf ~/.CommandBox

      - name: Set ForgeBox API token
        run: box config set endpoints.forgebox.APIToken=${{ secrets.FORGEBOX_API_KEY }}

      - name: Publish to ForgeBox
        run: box publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Published to ForgeBox: https://forgebox.io/view/jdbcMonitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
